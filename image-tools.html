    <!-- Compressor Logic -->
    <script>
        const uploadInput = document.getElementById('upload-image');
        const formatSelect = document.getElementById('format-select');
        const qualitySlider = document.getElementById('quality-slider');
        const qualityVal = document.getElementById('quality-val');
        
        const previewImg = document.getElementById('preview-img');
        const previewText = document.getElementById('preview-text');
        const downloadBtn = document.getElementById('download-btn');
        
        const originalSizeText = document.getElementById('original-size');
        const compressedSizeText = document.getElementById('compressed-size');

        let originalFile = null;
        let compressedDataUrl = null;

        // Update Slider Text
        qualitySlider.addEventListener('input', (e) => {
            qualityVal.innerText = `${Math.round(e.target.value * 100)}%`;
            if (originalFile) compressImage(); // Live compression update
        });

        // Format Change
        formatSelect.addEventListener('change', () => {
            if (originalFile) compressImage();
        });

        // File Upload
        uploadInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            originalFile = file;
            originalSizeText.innerText = formatBytes(file.size);
            
            compressImage();
        });

        // Compression Engine using HTML5 Canvas
        function compressImage() {
            const reader = new FileReader();
            reader.readAsDataURL(originalFile);
            
            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;
                
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // Set canvas dimensions to image dimensions
                    canvas.width = img.width;
                    canvas.height = img.height;

                    // Draw image on canvas
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    // Get settings
                    const format = formatSelect.value;
                    const quality = parseFloat(qualitySlider.value);

                    // Convert to new format/quality
                    compressedDataUrl = canvas.toDataURL(format, quality);

                    // Update Preview
                    previewImg.src = compressedDataUrl;
                    previewImg.classList.remove('hidden');
                    previewText.classList.add('hidden');

                    // Calculate new size (Base64 size approximation)
                    const base64str = compressedDataUrl.split(',')[1];
                    const decoded = atob(base64str);
                    const newSize = decoded.length;
                    
                    compressedSizeText.innerText = formatBytes(newSize);

                    // Enable Download
                    downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    downloadBtn.removeAttribute('disabled');
                }
            }
        }

        // Download Button Click
        downloadBtn.addEventListener('click', () => {
            if (!compressedDataUrl) return;
            
            const a = document.createElement('a');
            a.href = compressedDataUrl;
            
            // Generate filename
            const ext = formatSelect.value === 'image/webp' ? 'webp' : (formatSelect.value === 'image/jpeg' ? 'jpg' : 'png');
            a.download = `Pahasu_Compressed.${ext}`;
            
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });

        // Utility: Format Bytes
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }
    </script>
