<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pahasu.lk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { navy: '#0f172a', gold: '#fbbf24' } } } }
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border-t-4 border-navy">
        <div class="text-center mb-8">
            <a href="index.html" class="text-4xl font-bold text-navy tracking-wide block mb-2">
                Pahasu<span class="text-gold">.lk</span>
            </a>
            <p class="text-gray-500 font-semibold">Welcome Back! Login to access PRO tools.</p>
        </div>

        <form id="login-form">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">Email Address</label>
                <input type="email" class="w-full p-3 border border-gray-300 rounded focus:border-navy outline-none" placeholder="Enter your email" required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2">Password</label>
                <input type="password" class="w-full p-3 border border-gray-300 rounded focus:border-navy outline-none" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="w-full bg-navy hover:bg-blue-900 text-white font-bold py-3 rounded shadow transition mb-4">
                Login
            </button>
        </form>

        <div class="flex items-center justify-between mt-4 mb-4">
            <hr class="w-full border-gray-300">
            <span class="text-gray-400 px-3 font-bold">OR</span>
            <hr class="w-full border-gray-300">
        </div>

        <button class="w-full bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-700 font-bold py-3 rounded shadow-sm transition flex items-center justify-center gap-2">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="w-5 h-5">
            Continue with Google
        </button>

        <p class="text-center text-gray-500 mt-6">
            Don't have an account? <a href="#" class="text-navy font-bold hover:underline">Sign up for free</a>
        </p>
    </div>

</body>
</html>
